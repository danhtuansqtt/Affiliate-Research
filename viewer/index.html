<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiliate Viewer</title>
<style>
:root{--bg:#f3f4fb;--panel:#fff;--ink:#171a2b;--mute:#6b7191;--line:#e3e6f3;--accent:#6366f1;--accent2:#8b5cf6;--accent-ink:#fff;
--ok:#059669;--ok-bg:#d1fae5;--bad:#dc2626;--bad-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;--info-bg:#eceefa;--row:#eef0ff;--shadow:0 1px 2px rgba(23,26,43,.05),0 6px 20px rgba(80,84,160,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1a;--panel:#151829;--ink:#e9ebf8;--mute:#8e94b8;--line:#262a45;--accent:#7c83ff;--accent2:#a78bfa;--accent-ink:#0b0d1c;
--ok:#34d399;--ok-bg:#0f2f26;--bad:#fb7185;--bad-bg:#3b1420;--warn:#fbbf24;--warn-bg:#382a08;--info-bg:#232744;--row:#1c2040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c0e1a;--panel:#151829;--ink:#e9ebf8;--mute:#8e94b8;--line:#262a45;--accent:#7c83ff;--accent2:#a78bfa;--accent-ink:#0b0d1c;
--ok:#34d399;--ok-bg:#0f2f26;--bad:#fb7185;--bad-bg:#3b1420;--warn:#fbbf24;--warn-bg:#382a08;--info-bg:#232744;--row:#1c2040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spacer{flex:1}
.meta{color:var(--mute);font-size:12px}
button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:default}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.card .n{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.card .l{color:var(--mute);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:6px}
.bars i{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.filters{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:8px;font:inherit}
.filters input[type=search]{min-width:260px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--mute);cursor:pointer}
main{flex:1;min-height:0;display:flex;padding:0 16px 12px;gap:12px}
.tablewrap{flex:1;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th .ar{color:var(--mute);font-size:11px}
td{padding:8px 10px;min-width:70px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px}
td .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
tr.r{cursor:pointer}tr.r:hover td{background:var(--row)}tr.sel td{background:var(--row)}
.sub{color:var(--mute);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-bad{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-na{background:var(--info-bg);color:var(--mute)}
a.link{color:var(--accent);text-decoration:none;white-space:nowrap}a.link:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
aside{width:380px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:none}
aside.open{display:block}
aside h2{margin:0 0 2px;font-size:16px}
aside dl{margin:12px 0 0}
aside dt{color:var(--mute);font-size:12px;margin-top:10px}
aside dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.more{padding:12px;text-align:center}
.center{margin:auto;max-width:520px;padding:40px 16px;text-align:center}
.err{color:var(--bad)}
@media (max-width:900px){aside{position:fixed;inset:60px 8px 8px;width:auto;z-index:5}}

body{background:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent),radial-gradient(900px 400px at 100% 0,color-mix(in srgb,var(--accent2) 12%,transparent),transparent),var(--bg)}
header{background:linear-gradient(100deg,var(--accent),var(--accent2));border:0;color:#fff;box-shadow:var(--shadow);padding:12px 18px}
header h1{color:#fff;font-size:18px;letter-spacing:.2px}
header .meta{color:rgba(255,255,255,.8)}
header .tab{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;border-radius:999px;padding:7px 14px}
header .tab:hover{background:rgba(255,255,255,.26)}
header .tab[aria-selected="true"]{background:#fff;color:#4338ca;font-weight:650}
header .tab .sub{color:inherit;opacity:.7}
header .btn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;border-radius:999px}
header .btn.primary{background:#fff;color:#4338ca;font-weight:650}
header .btn:hover{filter:brightness(1.08)}
.cards{gap:12px;padding:16px 18px 0}
.card{position:relative;overflow:hidden;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 12px 16px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.card .ic{position:absolute;right:12px;top:10px;font-size:20px;opacity:.9}
.card .n{font-size:28px;line-height:1.1;letter-spacing:-.5px}
.card.click:hover{transform:translateY(-2px);transition:.15s;border-color:var(--c,var(--accent))}
.card.active{outline:2px solid var(--c,var(--accent));outline-offset:-2px}
.bars{height:40px}.bars i{cursor:pointer;background:linear-gradient(var(--accent2),var(--accent));opacity:.35;transition:.12s}
.bars i.in{opacity:1}.bars i:hover{opacity:.85}
.filters{padding:14px 18px 10px;gap:10px}
.bar2{display:flex;gap:10px;padding:14px 18px 0;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.seg button:hover{color:var(--ink)}
.seg button.on{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}
.dates{display:flex;align-items:center;gap:6px;color:var(--mute)}
.dates input{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 9px;border-radius:10px;font:inherit;color-scheme:light dark}
.dates input.on{border-color:var(--accent)}
.filters input[type=search],.filters select{border-radius:10px;box-shadow:var(--shadow)}
.filters input[type=search]:focus,.filters select:focus,.dates input:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{padding:0 18px 14px}
.tablewrap,aside{border-radius:14px;box-shadow:var(--shadow)}
th{background:color-mix(in srgb,var(--panel) 92%,var(--accent) 8%);font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
th:hover{color:var(--accent)}
tbody tr.r:nth-child(even) td{background:color-mix(in srgb,var(--panel) 97%,var(--accent) 3%)}
tr.r:hover td,tr.sel td{background:var(--row)!important}
tr.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
.badge{padding:3px 10px}
.b-bad::before{content:"✕ "}.b-ok::before{content:"✓ "}.b-warn::before{content:"? "}
.xbar{display:inline-block;width:46px;height:6px;border-radius:99px;background:var(--info-bg);vertical-align:middle;margin-right:6px;overflow:hidden}
.xbar i{display:block;height:100%;background:var(--c)}
a.link{background:var(--info-bg);padding:3px 9px;border-radius:999px;font-weight:600;font-size:12px}
a.link:hover{background:var(--accent);color:#fff;text-decoration:none}
aside{border-top:4px solid var(--accent)}

.vipbtn{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;letter-spacing:.3px;padding:10px 20px;border-radius:999px;color:#4a2c00;
background:linear-gradient(100deg,#ffd45a,#ff9f1c);box-shadow:0 0 0 0 rgba(255,184,28,.6),0 4px 14px rgba(255,159,28,.45);animation:glow 2.2s infinite}
.vipbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.vipbtn.run{animation:none;background:linear-gradient(100deg,#fff,#ffe7b0)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,184,28,.55),0 4px 14px rgba(255,159,28,.45)}70%{box-shadow:0 0 0 12px rgba(255,184,28,0),0 4px 14px rgba(255,159,28,.45)}100%{box-shadow:0 0 0 0 rgba(255,184,28,0),0 4px 14px rgba(255,159,28,.45)}}
.vs{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-hot{background:linear-gradient(100deg,#ff7a18,#ff3d6e);color:#fff}.t-good{background:var(--ok-bg);color:var(--ok)}
.t-mid{background:var(--warn-bg);color:var(--warn)}.t-cold{background:var(--info-bg);color:var(--mute)}
.spark{vertical-align:middle;margin-right:4px}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.modalbg{position:fixed;inset:0;background:rgba(8,10,25,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modalbg.open{display:flex}
.modal{background:var(--panel);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px 22px;border-top:5px solid #ffb81c}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .grp{margin:14px 0 0}.modal .grp>b{display:block;margin-bottom:6px}
.modal label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
.modal label small{display:block;color:var(--mute)}
.modal input[type=number]{width:70px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 8px;border-radius:8px;font:inherit}
.prog{height:12px;border-radius:99px;background:var(--info-bg);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd45a,#ff9f1c);transition:width .4s}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mfoot .vipbtn{animation:none}
.vipbox{margin:12px 0;padding:12px;border-radius:12px;background:var(--info-bg)}
.vipbox .big{font-size:30px;font-weight:800;line-height:1}
.pt{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;margin-top:7px;font-size:12px}
.pt .bar{height:7px;border-radius:99px;background:var(--panel);overflow:hidden}.pt .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pt span:last-child{text-align:right;color:var(--mute)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Affiliate Viewer</h1>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="spacer"></div>
  <span class="meta" id="meta"></span>
  <button class="vipbtn" id="vipbtn">⭐ Check VIP</button>
  <button class="btn" id="theme" title="Đổi sáng/tối">◐</button>
  <button class="btn primary" id="refresh">Làm mới từ Google Sheet</button>
</header>
<div id="app"></div>
<div class="modalbg" id="modal"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MISSING = /^(-|—|)$|^(chỉ xem sau khi đăng ký|site chặn truy cập|mạng cloud bị chặn|không công bố|không tìm thấy|không có)/i;

let DATA = null, TAB = null, SORT = {col: null, dir: 1}, SEL = null, LIMIT = 300;
const F = {q: "", ads: "", vip: "", topic: "", dedupe: true, from: "", to: "", preset: "all"};
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function setPreset(p) {
  const t = new Date(), day = n => { const d = new Date(t); d.setDate(d.getDate() - n); return iso(d); };
  F.preset = p; F.to = ""; F.from = "";
  if (p === "today") F.from = F.to = day(0);
  else if (p === "7") F.from = day(6);
  else if (p === "30") F.from = day(29);
  else if (p === "90") F.from = day(89);
}
const inRange = (m, o) => { const d = o.r[m.date] || ""; return (!F.from || d >= F.from) && (!F.to || d <= F.to); };

// ---- phân loại ----
function adsClass(v) {
  v = (v || "").trim();
  if (/^bị cấm/i.test(v)) return "bad";
  if (/^không cấm/i.test(v)) return "ok";
  if (/^chưa xác minh/i.test(v)) return "warn";
  return "na";
}
const ADS_LABEL = {bad: "Bị cấm", ok: "Không cấm", warn: "Chưa xác minh", na: "Không rõ"};
const colIdx = (h, ...names) => { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };

// ---- mô hình theo tab (nhận diện theo tiêu đề cột) ----
function model(tab) {
  const h = tab.header, i = n => colIdx(h, ...[].concat(n));
  const isAudit = h.includes("Advertiser Name");
  const m = {isAudit, h,
    date: i(["Date", "Ngày Tóm Tắt"]), topic: i("Topic"),
    name: i(isAudit ? "Tên Sản Phẩm" : "Product"), domain: i("Domain"), adv: i("Advertiser Name"),
    link: i("Link Đăng Ký Affiliate"), feat: i("Tính Năng"), price: i("Giá Bán"),
    comm: i("Hoa Hồng Affiliate"), ads: i("Google Ads"), year: i(["Năm Ra Đời"]),
    cookie: i(["Cookie (ngày)", "Thời Gian Cookie"])};
  return m;
}
function completeness(r, m) {
  const idx = [m.feat, m.price, m.comm, m.ads, m.year, m.cookie].filter(i => i >= 0);
  let n = 0;
  for (const i of idx) {
    const v = (r[i] || "").trim();
    if (i === m.ads) { if (/^(bị cấm|không cấm)/i.test(v)) n++; continue; }
    if (!MISSING.test(v)) n++;
  }
  return n;
}
function prepared(tab) {
  const m = model(tab);
  let rows = tab.rows.map((r, k) => ({r, k, x: completeness(r, m), ac: adsClass(r[m.ads])}));
  if (F.dedupe && m.domain >= 0 && !m.isAudit) {
    // giữ dòng mới nhất, nhiều dữ liệu nhất cho mỗi domain
    const best = new Map();
    for (const o of rows) {
      const key = (o.r[m.domain] || "").toLowerCase();
      const cur = best.get(key);
      const od = o.r[m.date] || "", cd = cur ? (cur.r[m.date] || "") : "";
      if (!cur || od > cd || (od === cd && o.x > cur.x)) best.set(key, o);
    }
    rows = rows.filter(o => best.get((o.r[m.domain] || "").toLowerCase()) === o);
  }
  for (const o of rows) { o.vk = vkey(m, o.r); o.v = VIP[o.vk]; o.vs = o.v ? vipScore(o.v, o, m).total : null; }
  return {m, rows};
}
function filtered(p, base) {
  const q = F.q.trim().toLowerCase();
  let rows = base.filter(o =>
    (!F.ads || o.ac === F.ads) &&
    (!F.vip || (F.vip === "none" ? o.vs === null : o.vs !== null && o.vs >= +F.vip)) &&
    (!F.topic || (o.r[p.m.topic] === F.topic)) &&
    (!q || o.r.some(c => (c || "").toLowerCase().includes(q))));
  if (SORT.col !== null) {
    const c = SORT.col;
    rows = rows.slice().sort((a, b) => {
      const sv = (o) => c === "x" ? o.x : c === "vip" ? (o.vs ?? -1) : c === "trend" ? (o.v?.trends?.change ?? -9999) : c === "tp" ? (o.v?.trustpilot?.score ?? -1) : (o.r[c] || "");
      const va = sv(a), vb = sv(b);
      const na = parseFloat(va), nb = parseFloat(vb);
      const cmp = (!isNaN(na) && !isNaN(nb) && String(na) === String(va).trim()) ? na - nb : String(va).localeCompare(String(vb), "vi");
      return cmp * SORT.dir;
    });
  } else rows = rows.slice().sort((a, b) => (b.r[p.m.date] || "").localeCompare(a.r[p.m.date] || "") || a.k - b.k);
  return rows;
}

// ---- hiển thị ----
function badge(cls, text) { return `<span class="badge b-${cls}">${esc(text)}</span>`; }
function adsCell(o, m) {
  const v = o.r[m.ads] || "";
  const detail = v.replace(/^[^(—]*[(—]\s*/, "").replace(/\)$/, "");
  return badge(o.ac, ADS_LABEL[o.ac]) + (detail && detail !== v ? `<div class="sub clip">${esc(detail)}</div>` : "");
}
function render() {
  const app = $("#app");
  if (!DATA) return;
  if (DATA.error) {
    app.innerHTML = `<div class="center"><h2>Chưa đọc được Google Sheet</h2><p class="err">${esc(DATA.error)}</p>
    <p class="sub">File khóa đang dùng: ${esc(DATA.key || "(chưa có)")}</p>
    <p><input type="text" id="sheetlink" placeholder="Dán link Google Sheet (docs.google.com/spreadsheets/d/…)" style="width:min(420px,90%);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit"> <button class="btn" id="savesheet">Lưu link</button></p>
    <p><button class="btn primary" id="pick">Chọn file khóa…</button> <button class="btn" id="retry">Thử lại</button></p></div>`;
    $("#pick").onclick = pickKey; $("#retry").onclick = refresh;
    $("#savesheet").onclick = async () => { const r = await (await fetch("/api/set-sheet", {method: "POST", body: JSON.stringify({value: $("#sheetlink").value})})).json(); if (r.error) { alert(r.error); return; } refresh(); };
    return;
  }
  const names = Object.keys(DATA.tabs);
  if (!TAB || !DATA.tabs[TAB]) TAB = names.includes("Affiliate Research") ? "Affiliate Research" : names[0];
  $("#tabs").innerHTML = names.map(n => `<button class="tab" role="tab" aria-selected="${n === TAB}" data-t="${esc(n)}">${esc(n)} <span class="sub">${DATA.tabs[n].rows.length}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { TAB = b.dataset.t; SORT = {col: null, dir: 1}; SEL = null; LIMIT = 300; F.ads = ""; F.topic = ""; render(); });
  $("#meta").textContent = "Cập nhật: " + DATA.fetched_at;

  const tab = DATA.tabs[TAB], p = prepared(tab), m = p.m, every = p.rows, all = every.filter(o => inRange(m, o)), rows = filtered(p, all);
  LAST = {tab, m, rows};
  const cnt = c => all.filter(o => o.ac === c).length;
  const nVip = all.filter(o => o.vs !== null).length, nHot = all.filter(o => o.vs >= 70).length;
  const topics = [...new Set(all.map(o => o.r[m.topic]).filter(Boolean))].sort();
  const dates = {}; every.forEach(o => { const d = o.r[m.date]; if (d) dates[d] = (dates[d] || 0) + 1; });
  const dk = Object.keys(dates).sort().slice(-30), dmax = Math.max(1, ...dk.map(d => dates[d]));
  const avg = all.length ? (all.reduce((s, o) => s + o.x, 0) / all.length).toFixed(1) : "0";
  const doms = new Set(all.map(o => (o.r[m.domain] || o.r[m.name] || "").toLowerCase())).size;

  app.innerHTML = `
  <div class="cards">
    <div class="card" style="--c:var(--accent)"><span class="ic">📊</span><div class="n">${all.length}</div><div class="l">${m.isAudit ? "sản phẩm đã audit" : "chương trình (" + (F.dedupe ? "sau khi gộp trùng domain" : "tất cả dòng") + ")"}</div></div>

let VIP = {}, JOB = {running: false, done: 0, total: 0, current: ""}, LAST = null, POLL = null;
const ALL_CHECKS = ["trends", "trustpilot", "news", "hn", "age"];
function guessDomain(d, name) {
  d = (d || "").trim().toLowerCase();
  if (d && d !== "-" && d.includes(".")) return d.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
  const mm = (name || "").toLowerCase().match(/\b([a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,})\b/);
  return mm ? mm[1] : "";
}
function cleanName(p) { return ((p || "").split(/\s+[–—-]\s+|\s*[(\[]/)[0] || "").trim(); }
function vkey(m, r) { const d = guessDomain(m.domain >= 0 ? r[m.domain] : "", r[m.name]); return d || "n:" + cleanName(r[m.name]).toLowerCase(); }
function vipItem(m, r) { return {key: vkey(m, r), product: r[m.name], domain: guessDomain(m.domain >= 0 ? r[m.domain] : "", r[m.name])}; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// Điểm VIP 0-100 = tổng điểm các phần CÓ dữ liệu, quy về thang 100 (nguồn lỗi thì bỏ qua, không bị trừ điểm).
function vipScore(v, o, m) {
  const parts = [];
  const t = v.trends;
  if (t && !t.error) {
    parts.push({l: "Độ quan tâm", max: 25, pts: 25 * t.avg / 100, note: `Trends TB ${t.avg}/100`});
    parts.push({l: "Đà tăng 30 ngày", max: 20, pts: t.change === null ? 0 : 20 * clamp((t.change + 50) / 150, 0, 1), note: t.change === null ? "chưa đủ dữ liệu" : (t.change >= 0 ? "+" : "") + t.change + "%"});
  }
  const tp = v.trustpilot;
  if (tp && !tp.error) {
    parts.push(tp.found ? {l: "Uy tín Trustpilot", max: 20, pts: 15 * tp.score / 5 + 5 * Math.min(tp.reviews, 500) / 500, note: `★${tp.score} · ${tp.reviews} đánh giá`}
      : {l: "Uy tín Trustpilot", max: 20, pts: 0, note: "chưa có trang"});
  }
  const n = v.news, h = v.hn;
  if ((n && !n.error) || (h && !h.error)) {
    const np = n && !n.error ? 10 * Math.min(n.d30, 50) / 50 : 0, hp = h && !h.error ? 5 * Math.min(h.posts, 10) / 10 : 0;
    parts.push({l: "Truyền thông", max: 15, pts: np + hp, note: `${n && !n.error ? n.d30 + " tin" : "?"} · ${h && !h.error ? h.posts + " bài HN" : "?"}`});
  }
  const ads = o.ac === "ok" ? 10 : o.ac === "warn" ? 6 : o.ac === "bad" ? 0 : 3;
  const link = /^https?:\/\//.test(o.r[m.link] || "") ? 5 : 0;
  parts.push({l: "Phù hợp chạy ads", max: 20, pts: ads + 5 * o.x / 6 + link, note: `Ads ${ADS_LABEL[o.ac]} · đủ ${o.x}/6`});
  const mx = parts.reduce((a, p) => a + p.max, 0), got = parts.reduce((a, p) => a + p.pts, 0);
  return {total: Math.round(got / mx * 100), parts};
}
function tier(s) { return s >= 70 ? ["t-hot", "🔥"] : s >= 50 ? ["t-good", "👍"] : s >= 30 ? ["t-mid", "😐"] : ["t-cold", "❄️"]; }
function vipBadge(s) { const [c, e] = tier(s); return `<span class="vs ${c}">${e} ${s}</span>`; }
function spark(series, w = 64, h = 22) {
  if (!series || series.length < 2) return "";
  const mx = Math.max(1, ...series), pts = series.map((v, i) => `${(i / (series.length - 1) * w).toFixed(1)},${(h - 2 - v / mx * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function trendCell(v) {
  const t = v && v.trends; if (!t) return `<span class="sub">—</span>`;
  if (t.error) return `<span class="sub" title="${esc(t.error)}">⚠ lỗi</span>`;
  const c = t.change; return spark(t.series) + (c === null ? "" : `<span class="${c >= 0 ? "up" : "down"}">${c >= 0 ? "▲" : "▼"}${Math.abs(c)}%</span>`);
}
function tpCell(v) {
  const t = v && v.trustpilot; if (!t) return `<span class="sub">—</span>`;
  if (t.error) return `<span class="sub" title="${esc(t.error)}">⚠ lỗi</span>`;
  if (!t.found) return `<span class="sub">chưa có</span>`;

}
function vipPanel(r, m) {
  const it = vipItem(m, r), v = VIP[it.key], kw = cleanName(r[m.name]);
  const links = `<div class="links"><a class="link" target="_blank" rel="noopener" href="https://trends.google.com/trends/explore?date=today%201-m&q=${encodeURIComponent(kw)}">Google Trends ↗</a>` +
    (it.domain ? `<a class="link" target="_blank" rel="noopener" href="https://www.trustpilot.com/review/${esc(it.domain)}">Trustpilot ↗</a>` : "") +
    `<a class="link" target="_blank" rel="noopener" href="https://news.google.com/search?q=${encodeURIComponent('"' + kw + '"')}%20when%3A30d">Tin tức ↗</a></div>`;
  if (!v) return `<div class="vipbox"><b>⭐ VIP</b> · chưa check <button class="btn" id="vipone" style="float:right">Check VIP dòng này</button>${links}</div>`;
  const o = {r, x: completeness(r, m), ac: adsClass(r[m.ads])}, sc = vipScore(v, o, m);
  const errs = ALL_CHECKS.filter(k => v[k] && v[k].error).map(k => `${k}: ${v[k].error}`);
  return `<div class="vipbox"><div style="display:flex;align-items:center;gap:12px"><div class="big">${sc.total}</div><div>${vipBadge(sc.total)}<div class="sub">từ khóa “${esc(v.keyword || kw)}” · check ${esc(v.at || "")}</div></div>
    <button class="btn" id="vipone" style="margin-left:auto">Check lại</button></div>
    ${sc.parts.map(p => `<div class="pt"><span>${p.l}</span><div class="bar"><i style="width:${p.pts / p.max * 100}%"></i></div><span>${p.pts.toFixed(1)}/${p.max}</span></div><div class="sub" style="margin-left:104px;margin-top:-4px">${esc(p.note)}</div>`).join("")}
    ${v.trends && v.trends.series ? `<div style="margin-top:10px">${spark(v.trends.series, 300, 44)}<div class="sub">Google Trends 30 ngày qua</div></div>` : ""}
    ${v.age && v.age.since ? `<div class="sub" style="margin-top:6px">Domain tồn tại từ ${esc(v.age.since)} (${esc(v.age.src)})</div>` : ""}
    ${errs.length ? `<div class="sub err" style="margin-top:6px">⚠ ${esc(errs.join(" | "))}</div>` : ""}${links}</div>`;
}

  const last = JOB.total && !JOB.running ? `<div class="sub" style="margin-top:6px">Lượt trước: đã check ${JOB.done}/${JOB.total} sản phẩm.</div>` : "";
  el.innerHTML = `<div class="modal"><h2>⭐ Check VIP</h2><div class="sub">Tìm sản phẩm đang hot để ưu tiên chạy affiliate. Dữ liệu từ nguồn công khai, cần mạng.</div>${last}
    <div class="grp"><b>Kiểm tra gì?</b>${ALL_CHECKS.map(k => `<label><input type="checkbox" data-c="${k}" ${MS.checks.has(k) ? "checked" : ""}><span>${CHK_LABEL[k][0]}<small>${CHK_LABEL[k][1]}</small></span></label>`).join("")}</div>
    <div class="grp"><b>Phạm vi</b>
      <label><span>Các dòng đang hiển thị (theo bộ lọc và thứ tự sắp xếp hiện tại), tối đa <input type="number" id="mn" min="1" max="300" value="${MS.n}"> sản phẩm</span></label>
      <label><input type="checkbox" id="mrecent" ${MS.recent ? "checked" : ""}><span>Bỏ qua sản phẩm đã check trong 7 ngày qua</span></label></div>
    <div class="grp sub">Sẽ check <b>${tg.length}</b> sản phẩm · ước tính ~${mins} phút. Google Trends có thể tạm chặn nếu check quá dồn dập.</div>
    <div class="mfoot"><button class="btn" id="mclose">Đóng</button><button class="vipbtn" id="mgo" ${tg.length && MS.checks.size ? "" : "disabled"}>⭐ Bắt đầu check</button></div></div>`;
  el.querySelectorAll("input[data-c]").forEach(i => i.onchange = () => { i.checked ? MS.checks.add(i.dataset.c) : MS.checks.delete(i.dataset.c); renderModal(); });
  $("#mn").onchange = e => { MS.n = clamp(+e.target.value || 1, 1, 300); renderModal(); };
  $("#mrecent").onchange = e => { MS.recent = e.target.checked; renderModal(); };
  $("#mclose").onclick = closeVip;
  $("#mgo").onclick = () => startVip(tg, [...MS.checks]);
}
$("#vipbtn").onclick = openVip;
$("#modal").onclick = e => { if (e.target.id === "modal") closeVip(); };

// ---- tải dữ liệu ----
async function reload() { $("#app").innerHTML = `<div class="center sub">Đang tải…</div>`; DATA = await (await fetch("/api/data")).json(); render(); }
async function refresh() {
  const b = $("#refresh"); b.disabled = true; b.textContent = "Đang tải từ Google Sheet…";
  try { DATA = await (await fetch("/api/refresh", {method: "POST", body: "{}"})).json(); render(); }
  finally { b.disabled = false; b.textContent = "Làm mới từ Google Sheet"; }
}
async function pickKey() { await fetch("/api/pick-key", {method: "POST", body: "{}"}); await refresh(); }
$("#refresh").onclick = refresh;
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("theme", nx); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
setInterval(() => fetch("/api/ping").catch(() => {}), 5000); fetch("/api/ping").catch(() => {});
fetch("/api/vip").then(r => r.json()).then(d => { VIP = d.results; JOB = d.job; updVipBtn(); if (JOB.running) pollVip(); }).catch(() => {}).finally(reload);
</script>
</body>
