<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiliate Viewer</title>
<style>
:root{--bg:#f3f4fb;--panel:#fff;--ink:#171a2b;--mute:#6b7191;--line:#e3e6f3;--accent:#6366f1;--accent2:#8b5cf6;--accent-ink:#fff;
--ok:#059669;--ok-bg:#d1fae5;--bad:#dc2626;--bad-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;--info-bg:#eceefa;--row:#eef0ff;--shadow:0 1px 2px rgba(23,26,43,.05),0 6px 20px rgba(80,84,160,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1a;--panel:#151829;--ink:#e9ebf8;--mute:#8e94b8;--line:#262a45;--accent:#7c83ff;--accent2:#a78bfa;--accent-ink:#0b0d1c;
--ok:#34d399;--ok-bg:#0f2f26;--bad:#fb7185;--bad-bg:#3b1420;--warn:#fbbf24;--warn-bg:#382a08;--info-bg:#232744;--row:#1c2040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c0e1a;--panel:#151829;--ink:#e9ebf8;--mute:#8e94b8;--line:#262a45;--accent:#7c83ff;--accent2:#a78bfa;--accent-ink:#0b0d1c;
--ok:#34d399;--ok-bg:#0f2f26;--bad:#fb7185;--bad-bg:#3b1420;--warn:#fbbf24;--warn-bg:#382a08;--info-bg:#232744;--row:#1c2040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spacer{flex:1}
.meta{color:var(--mute);font-size:12px}
button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 16px 0}

.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}

.bars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:6px}
.bars i{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.filters{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:8px;font:inherit}
.filters input[type=search]{min-width:260px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--mute);cursor:pointer}

table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}

.b-bad{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-na{background:var(--info-bg);color:var(--mute)}
a.link{color:var(--accent);text-decoration:none;white-space:nowrap}a.link:hover{text-decoration:underline}

.filters{padding:14px 18px 10px;gap:10px}

main{padding:0 18px 14px}

tbody tr.r:nth-child(even) td{background:color-mix(in srgb,var(--panel) 97%,var(--accent) 3%)}

tr.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
.badge{padding:3px 10px}
.b-bad::before{content:"✕ "}.b-ok::before{content:"✓ "}.b-warn::before{content:"? "}

a.link{background:var(--info-bg);padding:3px 9px;border-radius:999px;font-weight:600;font-size:12px}
a.link:hover{background:var(--accent);color:#fff;text-decoration:none}
aside{border-top:4px solid var(--accent)}

background:linear-gradient(100deg,#ffd45a,#ff9f1c);box-shadow:0 0 0 0 rgba(255,184,28,.6),0 4px 14px rgba(255,159,28,.45);animation:glow 2.2s infinite}

.t-hot{background:linear-gradient(100deg,#ff7a18,#ff3d6e);color:#fff}.t-good{background:var(--ok-bg);color:var(--ok)}
.t-mid{background:var(--warn-bg);color:var(--warn)}.t-cold{background:var(--info-bg);color:var(--mute)}
.spark{vertical-align:middle;margin-right:4px}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.prog{height:12px;border-radius:99px;background:var(--info-bg);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd45a,#ff9f1c);transition:width .4s}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.pt{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;margin-top:7px;font-size:12px}
.pt .bar{height:7px;border-radius:99px;background:var(--panel);overflow:hidden}.pt .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pt span:last-child{text-align:right;color:var(--mute)}

/* Chi tiết sản phẩm: cửa sổ nổi giữa màn hình; khi app toàn màn hình (class .fs) thì phủ kín (Esc hoặc nút Đóng để thoát) */
aside.open{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(920px,92vw);max-width:none;max-height:90vh;z-index:40;border-radius:14px;padding:18px 22px 24px;box-shadow:0 0 0 100vmax rgba(8,10,25,.55),0 20px 60px rgba(0,0,0,.45)}

aside.open h2{font-size:22px;margin-bottom:4px}
aside.open dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:0 18px}
aside.open dd{line-height:1.5}
aside.open.fs{inset:0;transform:none;width:auto;max-height:none;border-radius:0;border:0;padding:20px max(20px,6vw) 40px;box-shadow:none}
aside.open.fs h2{font-size:26px}
aside.open.fs dl{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
aside.open.fs dd{font-size:15px}
.gembox{margin:12px 0;padding:12px;border-radius:12px;background:var(--info-bg)}
.gres{margin-top:8px}.gres h3{font-size:15px;margin:12px 0 4px}.gres p{margin:4px 0}.gres ul{margin:4px 0 4px 18px;padding:0}
.gchip{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-weight:700}.g-ok{background:var(--ok-bg);color:var(--ok)}.g-bad{background:var(--bad-bg);color:var(--bad)}.g-warn{background:var(--warn-bg);color:var(--warn)}
.gembtn{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;letter-spacing:.3px;padding:10px 20px;border-radius:999px;color:#4a2c00;
background:linear-gradient(100deg,#ffd45a,#ff9f1c);box-shadow:0 0 0 0 rgba(255,184,28,.6),0 4px 14px rgba(255,159,28,.45);animation:glow 2.2s infinite}
.gembtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.gembtn.run{animation:none;background:linear-gradient(100deg,#fff,#ffe7b0)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,184,28,.55),0 4px 14px rgba(255,159,28,.45)}70%{box-shadow:0 0 0 12px rgba(255,184,28,0),0 4px 14px rgba(255,159,28,.45)}100%{box-shadow:0 0 0 0 rgba(255,184,28,0),0 4px 14px rgba(255,159,28,.45)}}
.gtag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.gt-1{background:var(--ok-bg);color:var(--ok)}.gt-2{background:var(--warn-bg);color:var(--warn)}.gt-3{background:var(--bad-bg);color:var(--bad)}.gt-0{background:var(--info-bg);color:var(--mute)}
.modalbg{position:fixed;inset:0;background:rgba(8,10,25,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modalbg.open{display:flex}

<body>
<header>
  <h1>Affiliate Viewer</h1>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="spacer"></div>
  <span class="meta" id="ver" style="opacity:.8"></span>
  <span class="meta" id="meta"></span>
  <button class="gembtn" id="gembtn">🤖 Đánh giá Gemini</button>
  <button class="btn" id="theme" title="Đổi sáng/tối">◐</button>
  <button class="btn" id="chg" style="display:none">Đổi file</button>
  <button class="btn" id="acct" style="display:none"></button>
  <button class="btn primary" id="refresh">Làm mới từ Google Sheet</button>
</header>
<div id="updbar" style="display:none;padding:8px 16px;background:#ffd24a;color:#222;font-size:14px;align-items:center;gap:10px"></div>
<div id="app"></div>
<div class="modalbg" id="modal"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MISSING = /^(-|—|)$|^(chỉ xem sau khi đăng ký|site chặn truy cập|mạng cloud bị chặn|không công bố|không tìm thấy|không có)/i;

let DATA = null, TAB = null, SORT = {col: null, dir: 1}, SEL = null, LIMIT = 300;
const F = {q: "", ads: "", gem: "", topic: "", dedupe: true, from: "", to: "", preset: "all"};
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function setPreset(p) {
  const t = new Date(), day = n => { const d = new Date(t); d.setDate(d.getDate() - n); return iso(d); };
  F.preset = p; F.to = ""; F.from = "";
  if (p === "today") F.from = F.to = day(0);
  else if (p === "7") F.from = day(6);
  else if (p === "30") F.from = day(29);
  else if (p === "90") F.from = day(89);
}
const inRange = (m, o) => { const d = o.r[m.date] || ""; return (!F.from || d >= F.from) && (!F.to || d <= F.to); };

// ---- phân loại ----
function adsClass(v) {
  v = (v || "").trim();
  if (/^bị cấm/i.test(v)) return "bad";
  if (/^không cấm/i.test(v)) return "ok";
  if (/^chưa xác minh/i.test(v)) return "warn";
  return "na";
}
const ADS_LABEL = {bad: "Bị cấm", ok: "Không cấm", warn: "Chưa xác minh", na: "Không rõ"};
const colIdx = (h, ...names) => { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };

// ---- mô hình theo tab (nhận diện theo tiêu đề cột) ----
function model(tab) {
  const h = tab.header, i = n => colIdx(h, ...[].concat(n));
  const isAudit = h.includes("Advertiser Name");
  const m = {isAudit, h,
    date: i(["Date", "Ngày Tóm Tắt"]), topic: i("Topic"),
    name: i(isAudit ? "Tên Sản Phẩm" : "Product"), domain: i("Domain"), adv: i("Advertiser Name"),
    link: i("Link Đăng Ký Affiliate"), feat: i("Tính Năng"), price: i("Giá Bán"),
    comm: i("Hoa Hồng Affiliate"), ads: i("Google Ads"), year: i(["Năm Ra Đời"]),
    cookie: i(["Cookie (ngày)", "Thời Gian Cookie"])};
  return m;
}
function completeness(r, m) {
  const idx = [m.feat, m.price, m.comm, m.ads, m.year, m.cookie].filter(i => i >= 0);
  let n = 0;
  for (const i of idx) {
    const v = (r[i] || "").trim();
    if (i === m.ads) { if (/^(bị cấm|không cấm)/i.test(v)) n++; continue; }
    if (!MISSING.test(v)) n++;
  }
  return n;
}
function prepared(tab) {
  const m = model(tab);
  let rows = tab.rows.map((r, k) => ({r, k, x: completeness(r, m), ac: adsClass(r[m.ads])}));
  if (F.dedupe && m.domain >= 0 && !m.isAudit) {
    // giữ dòng mới nhất, nhiều dữ liệu nhất cho mỗi domain
    const best = new Map();
    for (const o of rows) {
      const key = (o.r[m.domain] || "").toLowerCase();
      const cur = best.get(key);
      const od = o.r[m.date] || "", cd = cur ? (cur.r[m.date] || "") : "";
      if (!cur || od > cd || (od === cd && o.x > cur.x)) best.set(key, o);
    }
    rows = rows.filter(o => best.get((o.r[m.domain] || "").toLowerCase()) === o);
  }
  for (const o of rows) o.ev = EVALS[gid(o.r, m)] || null;
  return {m, rows};
}
function filtered(p, base) {
  const q = F.q.trim().toLowerCase();
  let rows = base.filter(o =>
    (!F.ads || o.ac === F.ads) &&
    (!F.gem || (F.gem === "none" ? !o.ev : !!(o.ev && o.ev.tier && o.ev.tier.startsWith("Tier " + F.gem)))) &&
    (!F.topic || (o.r[p.m.topic] === F.topic)) &&
    (!q || o.r.some(c => (c || "").toLowerCase().includes(q))));
  if (SORT.col !== null) {
    const c = SORT.col;
    rows = rows.slice().sort((a, b) => {
      const sv = (o) => c === "x" ? o.x : c === "gem" ? (o.ev && o.ev.score != null ? o.ev.score : -1) : (o.r[c] || "");
      const va = sv(a), vb = sv(b);
      const na = parseFloat(va), nb = parseFloat(vb);
      const cmp = (!isNaN(na) && !isNaN(nb) && String(na) === String(va).trim()) ? na - nb : String(va).localeCompare(String(vb), "vi");
      return cmp * SORT.dir;
    });
  } else rows = rows.slice().sort((a, b) => (b.r[p.m.date] || "").localeCompare(a.r[p.m.date] || "") || a.k - b.k);
  return rows;
}

// ---- hiển thị ----
function badge(cls, text) { return `<span class="badge b-${cls}">${esc(text)}</span>`; }
function adsCell(o, m) {
  const v = o.r[m.ads] || "";
  const detail = v.replace(/^[^(—]*[(—]\s*/, "").replace(/\)$/, "");
  return badge(o.ac, ADS_LABEL[o.ac]) + (detail && detail !== v ? `<div class="sub clip">${esc(detail)}</div>` : "");
}
function render() {
  const app = $("#app");
  if (!DATA) return;
 
  stopWatch();

  }
  const tg = gemItems(), mins = Math.max(1, Math.round(tg.length * 25 / 60));
  const last = GJOB.total ? `<p class="sub">Lượt trước: xong ${GJOB.ok}, bỏ qua ${GJOB.skipped}, lỗi ${GJOB.fail}.</p>` : "";
  const err = GJOB.error ? `<p class="err">${esc(GJOB.error)}</p>` : "";
  el.innerHTML = `<div class="modal"><h2>🤖 Đánh giá Gemini hàng loạt</h2>
    <div class="sub">Chấm điểm theo skill 6 trụ cột (thang 100, Tier 1/2/3) cho các sản phẩm đang hiện trong bảng, theo thứ tự trên xuống. Kết quả lưu lại, mở sản phẩm là xem được chi tiết.</div>
    <div class="grp">Số sản phẩm tối đa: <input type="number" id="gn" min="1" max="100" value="${GM.n}"></div>
    <div class="grp"><label><input type="checkbox" id="gskip" ${GM.skipDone ? "checked" : ""}><span>Bỏ qua sản phẩm đã có điểm<small>Không tốn lượt Gemini cho sản phẩm đã đánh giá.</small></span></label>
      <label><input type="checkbox" id="gsrch" ${GM.search ? "checked" : ""}><span>Tra cứu web<small>Chậm hơn và tốn hạn mức hơn; có thể chạm giới hạn gói miễn phí.</small></span></label></div>
    <p>Sẽ đánh giá <b>${tg.length}</b> sản phẩm, ước tính khoảng <b>${mins}</b> phút. Gói Gemini miễn phí có giới hạn lượt mỗi phút; app tự chờ rồi thử lại, và tự dừng nếu lỗi liên tiếp.</p>${last}${err}
    <div class="mfoot"><button class="btn" id="mclose">Đóng</button><button class="gembtn" id="mgo" ${tg.length ? "" : "disabled"}>Bắt đầu</button></div></div>`;
  $("#gn").onchange = e => { GM.n = Math.max(1, Math.min(100, +e.target.value || 20)); renderGemModal(); };
  $("#gskip").onchange = e => { GM.skipDone = e.target.checked; renderGemModal(); };
  $("#gsrch").onchange = e => { GM.search = e.target.checked; };
  $("#mclose").onclick = closeGem; $("#mgo").onclick = startGem;
}
async function startGem() {
  const items = gemItems(); if (!items.length) return;
  const d = await (await fetch("/api/gemini-batch/start", {method: "POST", body: JSON.stringify({items, search: GM.search})})).json();
  if (d.error) { alert(d.error); return; }
  GJOB = d.job; pollGem(); updGemBtn(); renderGemModal();
}
function pollGem() {
  if (GPOLL) return;
  GPOLL = setInterval(async () => {
    let d; try { d = await (await fetch("/api/gemini-batch")).json(); } catch (e) { return; }
    const grew = Object.keys(d.brief).some(k => !EVALS[k] || EVALS[k].at !== d.brief[k].at);
    GJOB = d.job;
    if (grew) { try { EVALS = (await (await fetch("/api/gemini-evals")).json()).evals || EVALS; } catch (e) {} if (DATA && !DATA.error) render(); }
    updGemBtn(); renderGemModal();
    if (!GJOB.running) { clearInterval(GPOLL); GPOLL = null; }
  }, 2000);
}
$("#gembtn").onclick = openGem;
$("#modal").onclick = e => { if (e.target.id === "modal") closeGem(); };
fetch("/api/gemini-batch").then(r => r.json()).then(d => { GJOB = d.job; updGemBtn(); if (GJOB.running) pollGem(); }).catch(() => {});

// ---- tải dữ liệu ----
async function reload() { $("#app").innerHTML = `<div class="center sub">Đang tải…</div>`; DATA = await (await fetch("/api/data")).json(); render(); }
async function refresh() {
  const b = $("#refresh"); b.disabled = true; b.textContent = "Đang tải từ Google Sheet…";
  try { DATA = await (await fetch("/api/refresh", {method: "POST", body: "{}"})).json(); render(); }
  finally { b.disabled = false; b.textContent = "Làm mới từ Google Sheet"; }
}
async function installUpdate(bar) {
  bar.style.display = "flex";
  bar.innerHTML = "<span>Đang tải và cài bản mới, app sẽ tự mở lại sau vài giây…</span>";
  const r = await (await fetch("/api/update-install", {method: "POST", body: "{}"})).json();
  if (r.error) {
    bar.innerHTML = `<span>Không tự cập nhật được: ${esc(r.error)}</span> <button class="btn primary" id="doupd">Thử lại</button>`;
    $("#doupd").onclick = () => installUpdate(bar);
  }
}
// auto=true (lúc mở app): có bản mới thì tự cài luôn; kiểm tra định kỳ khi đang dùng thì chỉ hiện thanh báo để không ngắt việc anh đang làm.
async function checkUpdate(auto) {
  const bar = $("#updbar"), ver = $("#ver");
  try {
    const u = await (await fetch("/api/update-check")).json();
    ver.textContent = "Bản " + u.current + (u.error && !u.available ? " · không kiểm tra được bản mới" : "");
    ver.title = u.error ? "Lỗi kiểm tra bản mới: " + u.error : "Bản mới nhất: " + (u.latest || u.current);
    if (!u.available) return;
    if (!u.can_install) {
      bar.style.display = "flex";
      bar.innerHTML = `<span>Có bản mới (bản ${u.latest}, đang dùng ${u.current}). Tải bản mới ở trang Releases của repo.</span>`;
      return;
    }
    if (auto) { installUpdate(bar); return; }
    bar.style.display = "flex";
    bar.innerHTML = `<span>Có bản mới (bản ${u.latest}, đang dùng ${u.current}).</span> <button class="btn primary" id="doupd">Cập nhật ngay</button>`;
    $("#doupd").onclick = () => installUpdate(bar);
  } catch (e) { ver.textContent = "Không kiểm tra được bản mới"; }
}
checkUpdate(true);
setInterval(() => checkUpdate(false), 30 * 60 * 1000);
let WATCH_T = null;
function stopWatch() { if (WATCH_T) { clearInterval(WATCH_T); WATCH_T = null; } }
function startWatch(fn) { stopWatch(); fn(); WATCH_T = setInterval(fn, 2000); }
const openDrive = () => fetch("/api/open-drive", {method: "POST", body: "{}"});
function loginScreen() {
  $("#app").innerHTML = `<div class="center"><h2>Bước 1: Đăng nhập Google</h2>
    <p class="sub">Bấm nút bên dưới để mở Google Drive trong cửa sổ mới, rồi đăng nhập tài khoản Google của anh ở đó.</p>
    <p><button class="btn primary" id="odrive" style="padding:12px 22px;font-size:16px">Mở Google Drive và đăng nhập</button></p>
    <p class="sub" id="wstat">Đang chờ anh đăng nhập…</p></div>`;
  $("#odrive").onclick = openDrive;
  startWatch(async () => {
    let w; try { w = await (await fetch("/api/watch")).json(); } catch (e) { return; }
    if (w.signed_in) { stopWatch(); DATA = Object.assign(DATA || {}, w); w.need === "" ? refresh() : pickerScreen(); return; }
    const s = $("#wstat"); if (s) s.textContent = w.logging_in ? "Đang đăng nhập ở cửa sổ Google…" : "Đang chờ anh đăng nhập…";
  });
}
async function useFile(id, name) {
  const r = await (await fetch("/api/set-sheet", {method: "POST", body: JSON.stringify({value: id, name: name || ""})})).json();
  if (r.error) { alert(r.error); return; }
  DATA = Object.assign(DATA || {}, {need: "", sheet: {id: id, name: name || ""}}); TAB = null; stopWatch(); refresh();
}
function pickerScreen() {
  $("#app").innerHTML = `<div class="center" style="max-width:640px;margin:0 auto;text-align:left"><h2 style="text-align:center">Bước 2: Chọn file Google Sheet</h2>
    <p class="sub" style="text-align:center">Trong cửa sổ Google Drive, bấm đúp để mở file Google Sheet muốn xem. File đó sẽ hiện ở đây để anh xác nhận.</p>
    <p style="text-align:center"><button class="btn" id="odrive">Mở lại Google Drive</button></p>
    <div id="flist"><p class="sub" style="text-align:center">Chưa thấy file nào đang mở…</p></div>
    <p class="sub" style="text-align:center;margin-top:18px">Hoặc dán link Google Sheet:</p>
    <p style="text-align:center"><input type="text" id="sheetlink" placeholder="docs.google.com/spreadsheets/d/…" style="width:min(420px,90%);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit"> <button class="btn" id="savesheet">Dùng link</button></p></div>`;
  $("#odrive").onclick = openDrive;
  $("#savesheet").onclick = () => useFile($("#sheetlink").value, "");
  startWatch(async () => {
    let w; try { w = await (await fetch("/api/watch")).json(); } catch (e) { return; }
    if (!w.signed_in) { stopWatch(); DATA = Object.assign(DATA || {}, w); loginScreen(); return; }
    const box = $("#flist"); if (!box) return;
    if (!w.files.length) { box.innerHTML = '<p class="sub" style="text-align:center">Chưa thấy file nào đang mở…</p>'; return; }
    box.innerHTML = w.files.map(f => `<button class="btn primary" style="display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Dùng file: <b>${esc(f.name)}</b></button>`).join("");
    box.querySelectorAll("button").forEach(b => b.onclick = () => useFile(b.dataset.id, b.dataset.name));
  });
}
function showAcct() {
  const c = $("#chg"); $("#acct").style.display = "none";
  c.style.display = DATA && DATA.need === "" ? "" : "none";
  c.onclick = () => { DATA.need = "sheet"; pickerScreen(); openDrive(); };
}
$("#refresh").onclick = refresh;
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("theme", nx); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
setInterval(() => fetch("/api/ping").catch(() => {}), 5000); fetch("/api/ping").catch(() => {});
reload();
</script>
</body>
