name: build-mac-dmg
# Dựng Affiliate Viewer thành file .dmg cho MacBook (chip Apple Silicon) trên máy macOS của GitHub.
# Tải file: GitHub > tab Actions > lần chạy mới nhất > mục Artifacts > AffiliateViewer-mac-arm64.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'viewer/**'
      - '.github/workflows/build-mac-dmg.yml'
permissions:
  contents: write   # để đăng DMG lên GitHub Releases cho tính năng tự cập nhật
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ghi số build (app so số này với Release mới nhất để biết có bản mới)
        run: echo '${{ github.run_number }}' > viewer/version.txt
      - name: Ghi link Google Form ghi lượt xem (secret VIEW_FORM_URL; chưa đặt thì để trống = tắt tính năng)
        env:
          VIEW_FORM_URL: ${{ secrets.VIEW_FORM_URL }}
        run: printf '%s' "$VIEW_FORM_URL" > viewer/form.txt
      - name: Build .app và .dmg
        run: bash viewer/build-dmg.sh
      - name: Kiểm tra file .dmg
        run: |
          ls -la viewer/dist/AffiliateViewer.dmg
          hdiutil imageinfo viewer/dist/AffiliateViewer.dmg | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: AffiliateViewer-mac-arm64
          path: viewer/dist/AffiliateViewer.dmg
          retention-days: 30
      - name: Đăng lên GitHub Releases (app tự cập nhật từ đây)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" viewer/dist/AffiliateViewer.dmg \
            --title "Affiliate Viewer bản ${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" --latest
